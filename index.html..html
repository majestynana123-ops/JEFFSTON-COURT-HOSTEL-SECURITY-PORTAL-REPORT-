<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jeffston Court Security Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #1a3a5a; border-left: 5px solid #3498db; padding-left: 15px; margin-bottom: 25px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box { flex-grow: 1; padding: 12px; border: 2px solid #dfe6e9; border-radius: 6px; outline: none; min-width: 200px; }
        
        .btn { border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .pdf-btn { background-color: #e67e22; color: white; }
        .pdf-btn:hover { background-color: #d35400; }
        .download-btn { background-color: #3498db; color: white; }
        .reset-btn { background-color: #e74c3c; color: white; margin-left: auto; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #3498db; color: white; text-align: left; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        .counter-btn { padding: 5px 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-minus { background-color: #ff7675; color: white; }
        .btn-plus { background-color: #55efc4; color: #004d3b; }
        .count-display { font-weight: bold; margin: 0 10px; min-width: 20px; display: inline-block; text-align: center; }

        .total-banner { background: #1a3a5a; color: white; padding: 20px; border-radius: 8px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; }
        .total-val { font-size: 1.5rem; color: #55efc4; }
        .status-tag { font-size: 0.8rem; padding: 3px 8px; border-radius: 12px; background: #ffeaa7; color: #d35400; }
    </style>
</head>
<body>

<div class="container">
    <h2>Jeffston Court Hostel | Security Desk</h2>
    
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" onkeyup="searchRoom()" placeholder="🔍 Search Room Number...">
        <button class="btn pdf-btn" onclick="downloadPDF()">📄 Download PDF</button>
        <button class="btn download-btn" onclick="downloadTXT()">📥 Text File</button>
        <button class="btn reset-btn" onclick="resetCounts()">🔄 Reset All</button>
    </div>

    <table id="roomTable">
        <thead>
            <tr>
                <th>Room</th>
                <th>Bed Type</th>
                <th>Occupancy</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="total-banner">
        <span>Current Occupancy:</span>
        <span class="total-val" id="totalCount">0</span>
    </div>
</div>

<script>
    let hostelData = [
        { id: 0, name: "A101", type: "4bed", students: 3, note: "" },
        { id: 1, name: "A102", type: "-",    students: 0, note: "" },
        { id: 2, name: "B201", type: "2bed", students: 2, note: "" },
        { id: 3, name: "B202", type: "4bed", students: 3, note: "" },
        { id: 4, name: "B203", type: "4bed", students: 0, note: "" },
        { id: 5, name: "C301", type: "2bed", students: 2, note: "" },
        { id: 6, name: "C302", type: "2bed", students: 2, note: "" },
        { id: 7, name: "C303", type: "2bed", students: 0, note: "Awaiting" }
    ];

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        let total = 0;
        tbody.innerHTML = hostelData.map(room => {
            total += room.students;
            return `<tr>
                <td><strong>${room.name}</strong></td>
                <td>${room.type}</td>
                <td>
                    <button class="counter-btn btn-minus" onclick="updateOccupancy(${room.id}, -1)">-</button>
                    <span class="count-display">${room.students}</span>
                    <button class="counter-btn btn-plus" onclick="updateOccupancy(${room.id}, 1)">+</button>
                </td>
                <td>${room.note ? `<span class="status-tag">${room.note}</span>` : 'Active'}</td>
            </tr>`;
        }).join('');
        document.getElementById('totalCount').innerText = total + " Students";
    }

    function updateOccupancy(id, change) {
        const room = hostelData.find(r => r.id === id);
        if (room.students + change >= 0) {
            room.students += change;
            renderTable();
        }
    }

    function resetCounts() {
        if (confirm("Reset all counts?")) {
            hostelData.forEach(room => room.students = 0);
            renderTable();
        }
    }

    function searchRoom() {
        let input = document.getElementById("searchInput").value.toUpperCase();
        let tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            let td = tr[i].getElementsByTagName("td")[0];
            tr[i].style.display = td.textContent.toUpperCase().includes(input) ? "" : "none";
        }
    }

    // PDF GENERATION FUNCTION
    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let total = 0;

        // Header
        doc.setFontSize(18);
        doc.text("JEFFSTON COURT HOSTEL - SECURITY REPORT", 14, 20);
        doc.setFontSize(10);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 28);

        // Table Data
        const rows = hostelData.map(r => {
            total += r.students;
            return [r.name, r.type, r.students, r.note || 'Active'];
        });

        doc.autoTable({
            startY: 35,
            head: [['Room', 'Type', 'Students', 'Status']],
            body: rows,
            theme: 'striped',
            headStyles: { fillColor: [52, 152, 219] }
        });

        // Summary
        let finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(`TOTAL HEADCOUNT: ${total} Students`, 14, finalY);
        
        doc.setFont(undefined, 'normal');
        doc.text("__________________________________", 14, finalY + 25);
        doc.text("Chief Security Officer Signature", 14, finalY + 32);

        doc.save(`Jeffston_Security_Report_${new Date().toISOString().split('T')[0]}.pdf`);
    }

    function downloadTXT() {
        let total = 0;
        let txt = `JEFFSTON COURT HOSTEL - REPORT\nDate: ${new Date().toLocaleString()}\n\n`;
        hostelData.forEach(r => {
            total += r.students;
            txt += `${r.name} | ${r.type} | ${r.students} students | ${r.note || 'Active'}\n`;
        });
        txt += `\nTOTAL: ${total}`;
        const blob = new Blob([txt], {type: 'text/plain'});
        const anchor = document.createElement('a');
        anchor.href = URL.createObjectURL(blob);
        anchor.download = "Hostel_Report.txt";
        anchor.click();
    }

    renderTable();
</script>
</body>
</html>
